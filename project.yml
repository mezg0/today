name: Today
options:
  bundleIdPrefix: com.brandongomes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  Today:
    type: application
    platform: macOS
    sources:
      - Today
    entitlements:
      path: Today/Today.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandongomes.today]
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: development
    info:
      path: Today/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Today
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandongomes.today
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7M3B48C774
        ENABLE_HARDENED_RUNTIME: YES
